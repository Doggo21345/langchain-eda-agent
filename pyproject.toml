[project]
name = "eda-agent"
version = "0.1.0"
description = "A LangChain agent that profiles datasets: null audits, distributions, correlations, plots, and run-over-run data quality logging."
readme = "README.md"
authors = [{ name = "Arya Panda" }]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "langchain>=1.0",
    "langchain-anthropic>=1.0",
    "pandas>=2.0",
    "numpy>=1.24",
    "pyarrow>=14",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
openai = ["langchain-openai>=1.0"]
dev = ["pytest>=8"]

[project.scripts]
eda-agent = "eda_agent.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/eda_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
